<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عشقم، بریم بیرون؟</title>
    <style>
        /* تنظیمات کلی صفحه */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: 'Tahoma', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* جلوگیری از اسکرول شدن */
            position: relative;
        }

        /* باکس وسط صفحه (متن و دکمه‌ها) */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 192, 203, 0.4);
            z-index: 10; /* بالای قلب‌ها قرار بگیره */
            position: relative;
        }

        h1 {
            color: #d63384;
            font-size: 24px;
            margin-bottom: 30px;
        }

        /* استایل دکمه‌ها */
        .btn {
            padding: 12px 30px;
            font-size: 18px;
            font-family: 'Tahoma', sans-serif;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 10px;
        }

        /* دکمه بریم (سبز) */
        .btn-yes {
            background-color: #28a745;
            color: white;
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }

        .btn-yes:hover {
            transform: scale(1.05);
            background-color: #218838;
        }

        /* دکمه نه نمیام (خاکستری/قرمز) */
        .btn-no {
            background-color: #f8d7da;
            color: #721c24;
            box-shadow: 0 5px 15px rgba(248, 215, 218, 0.4);
        }

        /* انیمیشن قلب‌های پس‌زمینه */
        .heart {
            position: absolute;
            color: #ff69b4;
            font-size: 24px;
            opacity: 0.6;
            animation: floatUp linear infinite;
            z-index: 1; /* زیر باکس اصلی */
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- باکس اصلی محتوا -->
    <div class="container">
        <h1 id="question">عشقم، آخر هفته بریم بیرون؟ 🥺</h1>
        
        <div id="buttons">
            <button class="btn btn-yes" id="btn-yes">بریم ❤️</button>
            <button class="btn btn-no" id="btn-no">نه نمیام</button>
        </div>
    </div>

    <!-- اسکریپت حرکت قلب‌ها و تغییر دکمه -->
    <script>
        // ۱. ساخت قلب‌های متحرک
        const body = document.body;
        const heartCount = 30; // تعداد قلب‌ها

        for (let i = 0; i < heartCount; i++) {
            let heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤'; // میتوانی به جای آن از سایزهای مختلف استفاده کنی
            
            // تنظیم سایز تصادفی
            let size = Math.random() * 30 + 10; // بین 10 تا 40 پیکسل
            heart.style.fontSize = size + 'px';
            
            // تنظیم موقعیت افقی تصادفی
            heart.style.left = Math.random() * 100 + 'vw';
            
            // تنظیم زمان انیمیشن تصادفی برای جلوگیری از حرکت یک‌دست
            let duration = Math.random() * 5 + 5; // بین 5 تا 10 ثانیه
            heart.style.animationDuration = duration + 's';
            
            // تاخیر تصادفی برای اینکه همه با هم شروع نشن
            heart.style.animationDelay = Math.random() * 5 + 's';
            
            body.appendChild(heart);
        }

        // ۲. کد تغییر دکمه "نه"
        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');

        btnNo.addEventListener('click', function() {
            // تغییر متن دکمه
            btnNo.innerHTML = 'باید بیای! ➡️';
            btnNo.style.backgroundColor = '#d1ecf1';
            btnNo.style.color = '#0c5460';
            
            // چرخش و حرکت دادن به سمت دکمه "بریم"
            btnNo.style.transform = 'rotate(10deg) scale(1.1)';
            
            // (اختیاری) بزرگتر کردن دکمه بریم
            btnYes.style.transform = 'scale(1.2)';
            btnYes.style.boxShadow = '0 0 30px rgba(40, 167, 69, 0.8)';
            
            // غیرفعال کردن دکمه "نه" که دیگه کلیک نشه
            btnNo.disabled = true;
            btnNo.style.cursor = 'not-allowed';
        });
    </script>
</body>
</html>
